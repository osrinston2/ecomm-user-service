server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /

spring:
  application:
    name: ecomm-user-service
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecomm_user_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

security:
  jwt:
    issuer: ${JWT_ISSUER:ecomm-auth-service}
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    jwks-uri: ${JWT_JWKS_URI:${security.jwt.auth-service-url}/api/v1/auth/.well-known/jwks.json}
    public-key-uri: ${JWT_PUBLIC_KEY_URI:${security.jwt.auth-service-url}/api/v1/auth/public-key}
    rsa:
      # Optional static PEM public key fallback (if empty, fetched & cached from ecomm-auth-service)
      public-key: ${JWT_RSA_PUBLIC_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.ecomm.user: DEBUG
    org.springframework.security: INFO
